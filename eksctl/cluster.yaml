apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: micro-service
  region: ap-south-1
  version: "1.31"

iam:
  withOIDC: true

managedNodeGroups:
  - name: ng-default
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    privateNetworking: true
