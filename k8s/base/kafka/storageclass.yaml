# The cluster's built-in gp2 class uses the removed in-tree provisioner; this one goes through
# the EBS CSI driver (installed by terraform/ebs-csi.tf). gp3 is also cheaper than gp2.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3
