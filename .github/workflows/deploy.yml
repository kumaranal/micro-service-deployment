name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: micro-service

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck

  build-and-push:
    needs: typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -f docker/Dockerfile \
            -t "$REGISTRY/${{ matrix.service }}:${{ github.sha }}" \
            .
          docker push "$REGISTRY/${{ matrix.service }}:${{ github.sha }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Set image tags and apply manifests
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            order-service="$REGISTRY/order-service:${{ github.sha }}" \
            inventory-service="$REGISTRY/inventory-service:${{ github.sha }}" \
            notification-service="$REGISTRY/notification-service:${{ github.sha }}"
          cd ../../..
          kubectl apply -k k8s/overlays/prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/order-service --timeout=180s
          kubectl rollout status deployment/inventory-service --timeout=180s
          kubectl rollout status deployment/notification-service --timeout=180s
